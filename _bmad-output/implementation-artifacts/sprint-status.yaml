stories:
  0-1-harness-port:
    epic: epic-0-harness
    title: "Porter skills BMad + skills projet + scripts + board depuis WasReal"
    status: done
    note: >-
      ✅ Mergé sur main le 2026-08-02 (sur instruction Florent). Gates allégés
      actés (1 reviewer adversarial + Codex cross-LLM). Tronc = main, releases
      par tag vX.Y.Z+N. SDK Flutter local aligné 3.24.5 → 3.44.8.

  # ── epic-3 : remédiation de l'audit ────────────────────────────────────────
  # Rapport complet : _bmad-output/reviews/audit-code-2026-08-02.md
  3-1-runapp-avant-reseau:
    epic: epic-3-audit-remediation
    title: "runApp() avant tout réseau : sortir la sync Firestore du chemin de boot"
    status: done   # ✅ PR #2 (squash 8f689b2).
    severity: blocker
    effort: S
    note: >-
      main.dart:39 attend FirebaseSyncService().initialize(), qui se termine par
      `await syncPendingGames()` (firebase_sync_service.dart:99) → `set()` sans
      timeout (l.153). Queue non vide + Wi-Fi captif (isConnected ne teste que le
      TYPE d'interface) = l'app ne démarre JAMAIS. Vérifié à la main 2026-08-02.
      Fix : initialize() en fire-and-forget APRÈS runApp() + .timeout() sur le
      set() individuel (borner la boucle ne suffit pas).

  3-2-modele-du-temps:
    epic: epic-3-audit-remediation
    title: "Unifier le modèle du temps (une seule autorité) + brancher le cycle de vie"
    status: done   # ✅ PR #2 (squash 8f689b2).
    severity: blocker
    effort: M
    prerequisite_for: epic-2-mode-fiesta
    note: >-
      Regroupe 5 findings de MÊME RACINE : le temps a 3 représentations
      (_timeRemaining widget, game.timeRemaining poussé 10×/s, turnEndTimestamp
      horloge murale) et AUCUNE n'est jamais gelée. _handleHomePress
      (turn_screen.dart:146) capture le temps restant puis ne gèle pas la
      deadline ; suspendGame (game_provider.dart:947) recalcule depuis la
      deadline périmée et IGNORE la valeur correcte → clamp(0,999) → tour terminé
      au retour. Zéro WidgetsBindingObserver dans lib/. Vérifié à la main.
      🔴 PRÉ-REQUIS FIESTA : malus de temps, tours bonus et règles par manche sont
      tous des mutations du temps de tour.

  3-3-schema-persiste:
    epic: epic-3-audit-remediation
    title: "Versionner le schéma persisté + quarantaine des blobs illisibles"
    status: done   # ✅ PR #2 (squash 8f689b2).
    severity: major
    effort: M
    prerequisite_for: epic-2-mode-fiesta
    note: >-
      Aucune schemaVersion sur les 9 clés guessItAll_*. Un blob illisible n'est
      jamais purgé (échec permanent), et word_history_service.dart:143 EFFACE
      l'historique sur une seule lecture ratée. 🔴 PRÉ-REQUIS FIESTA : Fiesta
      ajoute par construction des champs à GameState (modificateurs actifs,
      joueurs bloqués) — exactement l'événement contre lequel ce chantier protège.

  3-4-machine-etats-testable:
    epic: epic-3-audit-remediation
    title: "Rendre la machine à états testable (découper validateWords, tuer le snapshot manuel)"
    status: done   # ✅ PR #2 (squash 8f689b2).
    severity: major
    effort: L
    prerequisite_for: epic-2-mode-fiesta
    depends: [1-1-widget-test-scaffold]
    note: >-
      validateWords fait 167 lignes (game_provider.dart:711) ; aucune règle de
      score n'est atteignable sans instancier SharedPreferences + AnalyticsService
      + UserService. 🔴 PRÉ-REQUIS FIESTA : chaque modificateur est une variante
      de règle — sans point d'entrée testable, on les valide à la main en soirée.

  3-5-alleger-persiste:
    epic: epic-3-audit-remediation
    title: "Alléger le blob persisté + sortir les analytics de SharedPreferences"
    status: done   # ✅ PR #2 (squash 8f689b2). Sortie des analytics hors SharedPreferences REPORTÉE → notes_pour_plus_tard 2026-08-02.
    severity: major
    effort: M
    note: >-
      ~95 % du blob persisté est du remplissage (ordre de jeu matérialisé en 1000
      cycles) ; les analytics partagent le même fichier que l'état de jeu.
      Fortement recommandé avant Fiesta, pas bloquant.

  3-6-dedupliquer-ecrans:
    epic: epic-3-audit-remediation
    title: "Dédupliquer les dialogues d'écran + remettre le design system en circuit"
    status: done   # ✅ PR #2 (squash 8f689b2).
    severity: major
    effort: M
    note: >-
      341 lignes de dialogues copiées à l'octet près sur 4 écrans ; 7 usages
      d'AppModal contre 15 dialogues manuels ; stats_screen.dart = 972 lignes dont
      4 builders quasi identiques. Dette pure — acceptable APRÈS Fiesta.

  1-1-widget-test-scaffold:
    epic: epic-1-dette-baseline
    title: "Remplacer test/widget_test.dart (scaffold cassé) par un vrai smoke test"
    status: done   # ✅ PR #2 (squash 8f689b2).
    note: >-
      Le seul fichier de test du dépôt est le scaffold Flutter par défaut : il
      pumpWidget(const MyApp()) alors que la racine est GuessItAllApp, et teste un
      compteur inexistant. Conséquence : `flutter test` échoue à la COMPILATION →
      le dépôt n'a AUCUN test qui tourne, et le plancher déterministe est
      inutilisable. Coût réel : il faut fournir un GameProvider (SharedPreferences)
      et neutraliser UpgradeAlert (interroge le store) → ce n'est pas un fix
      mécanique. Bloque de fait le TDD de tout le pipeline.

  2-1-fiesta-cadrage:
    epic: epic-2-mode-fiesta
    title: "Cadrage grill-me du mode Fiesta (liste de modificateurs → arbitrages)"
    status: needs-design
    note: >-
      Ébauche fournie par Florent 2026-08-01 (~25 pistes de modificateurs :
      contraintes de mime, blocage de joueurs, malus/bonus de temps, règles par
      manche, tour bonus de rattrapage, manche 4 dessin…). À passer au grill-me
      AVANT bmad-create-epics-and-stories : la question structurante est le MODÈLE
      (un modificateur = quoi exactement ? portée tour/manche/partie, cumulabilité,
      effet sur le scoring et sur les analytics existantes).
