# Sprint Status — Guess It All (colonne vertébrale BMad : US → epic → statut)
# Créé 2026-08-01 lors du portage du harness. Maintenu par bmad-dev-story /
# bmad-sprint-status / à la main.
#
# STATUS DEFINITIONS
#   backlog        : identifié, story PAS encore écrite (pas de fichier .md)
#   needs-decision : bloqué sur un arbitrage produit/Florent avant d'écrire la story
#   needs-design   : design ouvert → grill-me / brainstorming / party-mode avant story
#   ready-for-dev  : story écrite + figée → dev-story peut prendre
#   in-progress    : dev-story en cours
#   review         : implémenté + revue close, en attente validation/merge Florent
#   done           : mergé sur main (accepté)
#   wont-do        : story abandonnée (décision produit)
#   deferred       : story ÉCRITE + décision figée, implémentation REPORTÉE
#   blocked        : dépendance amont non satisfaite (voir depends)
#
# Convention worktree (parallélisme) : 1 session = 1 worktree dédié feat/<slug>
# depuis origin/main. Un seul track à la fois sur game_provider.dart et sur le
# schéma SharedPreferences (points de collision structurels du dépôt).
#
# ⚠️ `done` = mergé ET accepté. Un merge provisoire sous-revue reste `review`.

