# Builds cloud Codemagic — Android AAB + iOS IPA depuis un clone propre, sans Mac branché.
# Runbook (secrets à créer, comment couper une release) : docs/releases-stores.md §Codemagic.
#
# 🔴 AUCUNE PUBLICATION AUJOURD'HUI (décision Florent) : une seule release, après le mode Fiesta.
# Les deux workflows BUILDENT et gardent les artefacts. Le bloc `publishing` de `release` est
# présent mais commenté — à activer à la 1re release.
#
# Noms à créer côté Codemagic (placeholders, cf. runbook) :
#   - keystore Android (Code signing identities) : gia_android_signing
#   - intégration App Store Connect (clé API)     : gia_asc_key
#   - groupe de variables                          : gia_firebase  (GOOGLE_SERVICES_JSON, base64)
#   - groupe de variables (publication, plus tard) : gia_google_play (GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS)

definitions:
  environment: &environment
    flutter: 3.44.8 # = SDK de dev (~/development/flutter). À bumper en même temps que lui.
    xcode: latest # à vérifier au 1er dry-run (compat Xcode ↔ Flutter 3.44)
    cocoapods: default
    android_signing:
      - gia_android_signing
    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.guessitall.guessItAllMobile
    groups:
      - gia_firebase

  scripts:
    - &pub_get
      name: flutter pub get
      script: flutter pub get
    - &analyze
      name: flutter analyze
      script: flutter analyze
    - &test
      name: flutter test
      script: flutter test
    - &android_secrets
      name: Android — key.properties + google-services.json (secrets, jamais commités)
      script: |
        cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
        storePassword=$CM_KEYSTORE_PASSWORD
        keyPassword=$CM_KEY_PASSWORD
        keyAlias=$CM_KEY_ALIAS
        storeFile=$CM_KEYSTORE_PATH
        EOF
        echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$CM_BUILD_DIR/android/app/google-services.json"
    - &build_aab
      name: Build Android AAB
      script: flutter build appbundle --release
    - &ios_signing
      name: iOS — profils de signature dans le projet Xcode
      script: xcode-project use-profiles
    - &build_ipa
      name: Build iOS IPA
      # Chemin de l'export plist généré par `use-profiles` : à vérifier au 1er dry-run.
      script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

  artifacts: &artifacts
    - build/**/outputs/**/*.aab
    - build/**/outputs/**/mapping.txt
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    # Podfile.lock n'est pas versionné et ne se génère pas sous WSL : on récupère celui du
    # 1er dry-run et on le commite (cf. runbook).
    - ios/Podfile.lock

workflows:
  # (a) Répétition générale — déclenchement MANUEL uniquement (pas de `triggering`).
  dry-run:
    name: Dry-run (build Android + iOS, sans publication)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gia_asc_key
    environment: *environment
    scripts:
      - *pub_get
      - *analyze
      - *test
      - *android_secrets
      - *build_aab
      - *ios_signing
      - *build_ipa
    artifacts: *artifacts

  # (b) Release — déclenchée par un tag `v*` (ex. v1.1.3+10).
  release:
    name: Release (tag v*) — build seulement, publication désactivée
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: gia_asc_key
    environment: *environment
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Garde — le tag doit valoir "v" + version de pubspec.yaml
        script: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          EXPECTED="v$PUBSPEC_VERSION"
          if [ "$CM_TAG" != "$EXPECTED" ]; then
            echo "Tag '$CM_TAG' ≠ '$EXPECTED' (pubspec.yaml). Bumper pubspec puis re-tagger." >&2
            exit 1
          fi
          echo "Tag OK : $CM_TAG"
      - *pub_get
      - *analyze
      - *test
      - *android_secrets
      - *build_aab
      - *ios_signing
      - *build_ipa
    artifacts: *artifacts
    # 🔴 PUBLICATION DÉSACTIVÉE — à activer à la 1re release (après le mode Fiesta), sur go Florent.
    # Pour activer : décommenter, et ajouter `gia_google_play` aux groups de l'environnement.
    # Rappel Google Play : le tout 1er upload d'une app se fait à la main (déjà le cas ici).
    # publishing:
    #   google_play:
    #     credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
