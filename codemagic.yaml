# Builds cloud Codemagic — Android AAB + iOS IPA depuis un clone propre, sans Mac branché.
# Runbook (secrets à créer, comment couper une release) : docs/releases-stores.md §Codemagic.
#
# Les deux workflows BUILDENT et gardent les artefacts. Seul `release` envoie, et seulement vers
# TestFlight (décision Florent). Google Play reste coupé, et rien ne part au public d'ici.
#
# Noms à créer côté Codemagic (placeholders, cf. runbook) :
#   - keystore Android (Code signing identities) : gia-android-signing
#   - intégration App Store Connect (clé API)     : "Guess It All (flow data)"
#   - groupe de variables                          : gia-firebase  (GOOGLE_SERVICES_JSON : JSON brut ou base64)
#   - groupe de variables (publication, plus tard) : gia-google-play (GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS)

definitions:
  environment: &environment
    flutter: 3.44.8 # = SDK de dev (~/development/flutter). À bumper en même temps que lui.
    xcode: latest # à vérifier au 1er dry-run (compat Xcode ↔ Flutter 3.44)
    cocoapods: default
    android_signing:
      - gia-android-signing
    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.guessitall.guessItAllMobile
    groups:
      - gia-firebase

  scripts:
    - &pub_get
      name: flutter pub get
      # Swift Package Manager (activé par défaut en Flutter 3.44) casse le build iOS :
      # flutter_native_splash n'a pas de paquet SPM valide (« public headers directory
      # path ... is invalid »). On reste sur CocoaPods tant que le plugin n'est pas corrigé.
      script: |
        flutter config --no-enable-swift-package-manager
        flutter pub get
    - &analyze
      name: flutter analyze
      # Même seuil que scripts/run-full-suite.sh : 0 error + 0 warning. Les `info`
      # (withOpacity, print…) sont du lint pré-existant et ne doivent pas casser le build.
      script: flutter analyze --no-fatal-infos
    - &test
      name: flutter test
      script: flutter test
    - &android_secrets
      name: Android — key.properties + google-services.json (secrets, jamais commités)
      script: |
        cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
        storePassword=$CM_KEYSTORE_PASSWORD
        keyPassword=$CM_KEY_PASSWORD
        keyAlias=$CM_KEY_ALIAS
        storeFile=$CM_KEYSTORE_PATH
        EOF
        # GOOGLE_SERVICES_JSON accepte le JSON collé tel quel OU sa version base64.
        GS="$CM_BUILD_DIR/android/app/google-services.json"
        case "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)" in
          "{") printf '%s' "$GOOGLE_SERVICES_JSON" > "$GS" ;;
          *)   printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > "$GS" ;;
        esac
    - &build_aab
      name: Build Android AAB
      script: flutter build appbundle --release
    - &ios_signing
      name: iOS — profils de signature dans le projet Xcode
      script: xcode-project use-profiles
    - &build_ipa
      name: Build iOS IPA
      # Chemin de l'export plist généré par `use-profiles` : à vérifier au 1er dry-run.
      script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

  artifacts: &artifacts
    - build/**/outputs/**/*.aab
    - build/**/outputs/**/mapping.txt
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    # Podfile.lock n'est pas versionné et ne se génère pas sous WSL : on récupère celui du
    # 1er dry-run et on le commite (cf. runbook).
    - ios/Podfile.lock

workflows:
  # (a) Répétition générale — déclenchement MANUEL uniquement (pas de `triggering`).
  dry-run:
    name: Dry-run (build Android + iOS, sans publication)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Guess It All (flow data)"
    environment: *environment
    scripts:
      - *pub_get
      - *analyze
      - *test
      - *android_secrets
      - *build_aab
      - *ios_signing
      - *build_ipa
    artifacts: *artifacts

  # (b) Release — déclenchée par un tag `v*` (ex. v1.1.3+10).
  release:
    name: Release (tag v*) — build et envoi TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Guess It All (flow data)"
    environment: *environment
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Garde — le tag doit valoir "v" + version de pubspec.yaml
        script: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          EXPECTED="v$PUBSPEC_VERSION"
          if [ "$CM_TAG" != "$EXPECTED" ]; then
            echo "Tag '$CM_TAG' ≠ '$EXPECTED' (pubspec.yaml). Bumper pubspec puis re-tagger." >&2
            exit 1
          fi
          echo "Tag OK : $CM_TAG"
      - *pub_get
      - *analyze
      - *test
      - *android_secrets
      - *build_aab
      - *ios_signing
      - *build_ipa
    artifacts: *artifacts
    # TestFlight seulement (go Florent) : rien ne part au public. La mise en production reste manuelle.
    # Google Play reste coupé : pour l'activer, décommenter et ajouter `gia-google-play` aux groups.
    publishing:
      # google_play:
      #   credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      app_store_connect:
        auth: integration
        submit_to_testflight: true
